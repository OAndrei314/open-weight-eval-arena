[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-weight-eval-arena"
version = "0.1.0"
description = "A small harness for benchmarking open-weight LLMs on custom task suites."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
