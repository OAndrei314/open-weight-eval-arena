# Copy to configs/models.yaml and fill in real base URLs / model ids for the providers
# you have API keys for. Any host exposing an OpenAI-compatible /v1/chat/completions
# endpoint works here (OpenRouter, Fireworks, Together, Groq, local vLLM/Ollama, etc).
models:
  - name: glm-5.3
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: zhipu/glm-5.3
    api_key_env: OPENROUTER_API_KEY
    # Fill with current provider pricing in USD per million tokens.
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0

  - name: deepseek-v4.1-flash
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4.1-flash
    api_key_env: OPENROUTER_API_KEY
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0

  - name: kimi-k3
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: moonshotai/kimi-k3
    api_key_env: OPENROUTER_API_KEY
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0

  - name: qwen-3.5
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen-3.5
    api_key_env: OPENROUTER_API_KEY
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0

  # Example local server (vLLM/Ollama with an OpenAI-compatible endpoint):
  - name: local-model
    provider: openai_compat
    base_url: http://localhost:11434/v1
    model: llama4
    api_key_env: null
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0
