# Copy to configs/models.yaml and fill in real base URLs / model ids for the providers
# you have API keys for. Any host exposing an OpenAI-compatible /v1/chat/completions
# endpoint works here (OpenRouter, Fireworks, Together, Groq, local vLLM/Ollama, etc).
models:
  - name: glm-5.2
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: zhipu/glm-5.2
    api_key_env: OPENROUTER_API_KEY

  - name: deepseek-v4
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4
    api_key_env: OPENROUTER_API_KEY

  - name: kimi-k3
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: moonshotai/kimi-k3
    api_key_env: OPENROUTER_API_KEY

  - name: qwen-3.5
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen-3.5
    api_key_env: OPENROUTER_API_KEY

  # Example local server (vLLM/Ollama with an OpenAI-compatible endpoint):
  - name: local-model
    provider: openai_compat
    base_url: http://localhost:11434/v1
    model: llama4
    api_key_env: null
